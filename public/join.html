<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>CoachTime — Join Session</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!-- livekit-client UMD, pinned to match the app's livekit-client ^2.19.2.
     Using the static (non-dynamically-minified) umd.js so Subresource Integrity
     is valid — jsDelivr's *.min.js is generated on the fly and must NOT use SRI. -->
<script
  src="https://cdn.jsdelivr.net/npm/livekit-client@2.19.2/dist/livekit-client.umd.js"
  integrity="sha384-bLjV1t5nl84HublK1kvShvGqp9KTXsQSx4d2QV3alRC0iqPqCNTBmF4eEnMPJ0Uh"
  crossorigin="anonymous"></script>
<style>
  :root {
    color-scheme: dark;
    --canvas: #0E0E0F;
    --surface: #16161A;
    --surface-2: #1E1E24;
    --text: #F2F0EB;
    --muted: #B8B6B0;
    --gold: #D4C36A;
    --live: #3BE37A;
    --danger: #E3563B;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--canvas);
    color: var(--text);
    font-family: "Space Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  button { font-family: inherit; cursor: pointer; }

  /* ---------- Lobby ---------- */
  #lobby {
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 40px 32px;
    max-width: 400px; width: 100%;
    box-shadow: 0 12px 48px rgba(0,0,0,0.45);
  }
  .brand { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--gold); margin: 0 0 6px; font-weight: 600; }
  .card h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; }
  .card .sub { font-size: 14px; color: var(--muted); margin: 0 0 28px; line-height: 1.5; }
  .room-pill { color: var(--gold); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
  input[type="text"] {
    width: 100%; background: var(--surface-2); border: 1px solid #2A2A30;
    color: var(--text); font-size: 16px; padding: 13px 14px; border-radius: var(--radius);
    margin: 0 0 20px; outline: none;
  }
  input[type="text"]:focus { border-color: var(--gold); }
  .btn-primary {
    width: 100%; background: var(--gold); color: #0E0E0F; border: 0;
    font-size: 16px; font-weight: 700; padding: 14px; border-radius: var(--radius);
    transition: opacity .15s ease;
  }
  .btn-primary:hover { opacity: .9; }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .err {
    background: rgba(227,86,59,0.12); border: 1px solid rgba(227,86,59,0.4);
    color: #F0A99A; font-size: 13px; padding: 10px 12px; border-radius: var(--radius);
    margin: 0 0 18px; display: none; line-height: 1.45;
  }

  /* ---------- Call stage ---------- */
  #stage { display: none; position: fixed; inset: 0; background: #000; }
  #remoteWrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--canvas);
  }
  #remoteVideo {
    width: 100%; height: 100%; object-fit: cover; background: #000;
    display: none;
  }
  #waiting {
    text-align: center; padding: 24px; max-width: 320px;
  }
  #waiting .dot {
    width: 12px; height: 12px; border-radius: 50%; background: var(--gold);
    margin: 0 auto 18px; animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.85);} 50% { opacity:1; transform:scale(1);} }
  #waiting h2 { font-size: 18px; margin: 0 0 6px; font-weight: 600; }
  #waiting p { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.5; }

  /* Local self-view PiP */
  #pip {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px;
    width: 108px; height: 152px; border-radius: var(--radius); overflow: hidden;
    background: var(--surface); box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.08); z-index: 5;
  }
  #localVideo { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #000; }
  #pipOff {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    font-size: 11px; color: var(--muted); text-align: center;
  }

  /* Live badge */
  #liveBadge {
    position: absolute; top: calc(env(safe-area-inset-top, 0px) + 18px); left: 16px;
    display: none; align-items: center; gap: 7px; z-index: 5;
    background: rgba(0,0,0,0.45); padding: 6px 11px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: .5px;
  }
  #liveBadge .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--live); box-shadow: 0 0 8px var(--live); }

  /* Controls */
  #controls {
    position: absolute; left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    display: flex; gap: 16px; justify-content: center; z-index: 6;
  }
  .ctrl {
    width: 56px; height: 56px; border-radius: 50%; border: 0;
    background: rgba(255,255,255,0.12); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(8px); transition: background .15s ease;
  }
  .ctrl:hover { background: rgba(255,255,255,0.2); }
  .ctrl.off { background: rgba(255,255,255,0.92); color: #0E0E0F; }
  .ctrl.leave { background: var(--danger); color: #fff; }
  .ctrl.leave:hover { background: #c8452d; }
  .ctrl svg { width: 24px; height: 24px; }
  /* unread dot on the Script control */
  .ctrl { position: relative; }
  .ctrl .unread {
    position: absolute; top: 4px; right: 4px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--gold); border: 2px solid var(--canvas);
    display: none;
  }
  .ctrl.has-unread .unread { display: block; }

  /* ---------- Co-watch film stage (sits over the camera in #remoteWrap) ---------- */
  #cowatch {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; background: #000;
    z-index: 3;
  }
  #cowatchVideo { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #cowatchFrame { width: 100%; height: 100%; border: 0; background: #000; }
  /* During co-watch the remote camera shrinks to a small PiP, lower-left. */
  #remoteWrap.cowatch #remoteVideo {
    position: absolute; left: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    width: 108px; height: 152px; object-fit: cover;
    border-radius: var(--radius); z-index: 4;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.08);
  }

  /* ---------- Annotation (telestration) overlay ---------- */
  #annoOverlay {
    position: absolute; inset: 0; display: none;
    pointer-events: none; z-index: 7;
  }
  #annoOverlay svg { width: 100%; height: 100%; display: block; }
  #annoOverlay path {
    fill: none; stroke: var(--gold); stroke-width: 4;
    stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 4px rgba(212,195,106,0.65));
  }
  /* Dim the live frame under the strokes while frozen. */
  #freezeScrim {
    position: absolute; inset: 0; display: none;
    background: rgba(0,0,0,0.28); z-index: 6; pointer-events: none;
  }
  /* Top pills (freeze / co-watch banners) */
  #topPill {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    display: none; align-items: center; gap: 8px; z-index: 9;
    max-width: calc(100% - 120px);
    background: rgba(0,0,0,0.55); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(212,195,106,0.35);
    color: var(--text); font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 999px; line-height: 1.3;
    text-align: center;
  }
  #topPill .pip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); flex: 0 0 auto; }
  #topPill .pip-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---------- Script panel ---------- */
  #scriptPanel {
    position: absolute;
    left: 16px; right: 16px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
    max-width: 420px; margin: 0 auto;
    background: rgba(22,22,26,0.96); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.55);
    padding: 16px 16px 14px; z-index: 8; display: none;
    max-height: 52vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  #scriptPanel.open { display: block; }
  #scriptPanel .sp-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 0 12px;
  }
  #scriptPanel .sp-title { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
  #scriptPanel .sp-progress { font-size: 12px; color: var(--gold); font-weight: 600; }
  #scriptPanel .sp-close {
    background: none; border: 0; color: var(--muted); font-size: 20px;
    line-height: 1; padding: 2px 6px; border-radius: 6px;
  }
  #scriptPanel .sp-close:hover { color: var(--text); background: rgba(255,255,255,0.08); }
  #scriptList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  #scriptList li {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 14px; line-height: 1.4; color: var(--text);
  }
  #scriptList li .box {
    flex: 0 0 auto; width: 18px; height: 18px; margin-top: 1px;
    border-radius: 5px; border: 1.5px solid #3A3A42;
    display: flex; align-items: center; justify-content: center;
  }
  #scriptList li.done .box { border-color: var(--gold); background: rgba(212,195,106,0.16); }
  #scriptList li.done .box svg { width: 12px; height: 12px; stroke: var(--gold); }
  #scriptList li.done .txt { color: var(--muted); }
  #scriptList .empty { color: var(--muted); font-size: 13px; line-height: 1.5; padding: 6px 0; }
  #notesList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  #notesList li { font-size: 14px; line-height: 1.4; color: var(--text); display: flex; gap: 8px; }
  #notesList li .nt { color: var(--gold); font-weight: 600; flex: 0 0 auto; font-size: 12px; margin-top: 1px; }
  #notesList .empty { color: var(--muted); font-size: 13px; line-height: 1.5; padding: 6px 0; }
  /* recording pill */
  #recPill {
    position: absolute; left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 64px);
    display: none; align-items: center; gap: 8px; z-index: 9;
    background: rgba(0,0,0,0.6); border: 1px solid rgba(227,86,59,0.5);
    color: var(--text); font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 999px;
  }
  #recPill .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); animation: pulse 1s ease-in-out infinite; }

  /* ---------- Moment toast ---------- */
  #toast {
    position: absolute; left: 50%; transform: translateX(-50%) translateY(8px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 92px);
    background: rgba(22,22,26,0.92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border: 1px solid rgba(212,195,106,0.4); color: var(--text);
    font-size: 14px; font-weight: 600; padding: 11px 18px; border-radius: 999px;
    box-shadow: 0 10px 32px rgba(0,0,0,0.5); z-index: 10;
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    max-width: calc(100% - 48px); text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

  <!-- Lobby -->
  <div id="lobby">
    <div class="card">
      <p class="brand">CoachTime</p>
      <h1>Join the session</h1>
      <p class="sub">Room <span class="room-pill" id="roomLabel">…</span><br/>Enter your name and tap join. Your browser will ask for camera and mic.</p>
      <div class="err" id="lobbyErr"></div>
      <label for="nameInput">Your name</label>
      <input type="text" id="nameInput" autocomplete="name" placeholder="e.g. Coach Mike" maxlength="40" />
      <button class="btn-primary" id="joinBtn">Join session</button>
    </div>
  </div>

  <!-- Call stage -->
  <div id="stage">
    <div id="remoteWrap">
      <video id="remoteVideo" autoplay playsinline></video>

      <!-- Co-watch film stage: a direct <video> or an embed <iframe> goes here. -->
      <div id="cowatch" aria-hidden="true"></div>

      <!-- Freeze scrim dims the live frame under the strokes. -->
      <div id="freezeScrim" aria-hidden="true"></div>

      <!-- Telestration overlay (SVG strokes from the coach). -->
      <div id="annoOverlay" aria-hidden="true">
        <!-- viewBox 0..1 maps the normalized wire coords 1:1; preserveAspectRatio
             none stretches it to the overlay's pixel size, so resize is free.
             Paths use vector-effect non-scaling-stroke so the 4px line stays 4px
             pixels regardless of the tiny coordinate space. -->
        <svg id="annoSvg" viewBox="0 0 1 1" preserveAspectRatio="none"></svg>
      </div>

      <div id="waiting">
        <div class="dot"></div>
        <h2>Waiting for the other coach…</h2>
        <p>You're connected. The session goes live when they join.</p>
      </div>
    </div>

    <!-- Top status pill: freeze/drawing or co-watch banner. -->
    <div id="topPill"><span class="pip-dot"></span><span class="pip-text" id="topPillText"></span></div>

    <div id="liveBadge"><span class="live-dot"></span>LIVE</div>
    <div id="recPill"><span class="rec-dot"></span><span id="recPillText">Recording your rep…</span></div>

    <!-- Practice-script checklist (read-only for the player). -->
    <div id="scriptPanel" role="region" aria-label="Practice script">
      <div class="sp-head">
        <span class="sp-title">Practice script</span>
        <span class="sp-progress" id="scriptProgress"></span>
        <button class="sp-close" id="scriptCloseBtn" aria-label="Close script">&times;</button>
      </div>
      <ul id="scriptList"></ul>
      <div class="sp-head" style="margin-top:14px">
        <span class="sp-title">Coach notes</span>
      </div>
      <ul id="notesList"></ul>
    </div>

    <!-- Transient moment toast. -->
    <div id="toast" role="status" aria-live="polite"></div>

    <div id="pip">
      <video id="localVideo" autoplay playsinline muted></video>
      <div id="pipOff">Camera off</div>
    </div>

    <div id="controls">
      <button class="ctrl" id="scriptBtn" aria-label="Practice script" title="Script"><span class="unread" aria-hidden="true"></span></button>
      <button class="ctrl" id="micBtn" aria-label="Toggle microphone" title="Mute"></button>
      <button class="ctrl" id="camBtn" aria-label="Toggle camera" title="Camera"></button>
      <button class="ctrl" id="flipBtn" aria-label="Flip camera" title="Flip camera"></button>
      <button class="ctrl leave" id="leaveBtn" aria-label="Leave session" title="Leave"></button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var LK = window.LivekitClient;
  var Room = LK.Room, RoomEvent = LK.RoomEvent, Track = LK.Track;

  // ---- room id from path: /web/<id> ----
  var parts = window.location.pathname.split("/").filter(Boolean);
  var roomId = parts.length ? parts[parts.length - 1] : "";
  // Client-side guard: only allow safe ids (matches the server validation).
  if (!/^[A-Za-z0-9-]{1,64}$/.test(roomId)) {
    document.getElementById("roomLabel").textContent = "invalid";
    showLobbyErr("This session link doesn't look right.");
    document.getElementById("joinBtn").disabled = true;
  } else {
    document.getElementById("roomLabel").textContent = roomId;
  }

  // ---- room ticket (Phase 0 security) ----
  // A no-signup browser athlete authenticates to /token with a server-signed,
  // room-scoped, short-lived room ticket the coach embedded in the link's URL
  // fragment (#t=...). Fragments stay client-side (never sent to the server in
  // the GET), so the ticket isn't logged. The server derives our identity; we
  // no longer pick our own guest id.
  var roomTicket = "";
  try {
    var h = window.location.hash || "";
    var m = h.match(/[#&]t=([^&]+)/);
    if (m) roomTicket = decodeURIComponent(m[1]);
    // Persist so a manual refresh (which can drop the fragment) still works
    // within the ticket's lifetime; scoped per room.
    var TICKET_KEY = "coachtime_ticket_" + roomId;
    if (roomTicket) {
      try { sessionStorage.setItem(TICKET_KEY, roomTicket); } catch (e) {}
    } else {
      try { roomTicket = sessionStorage.getItem(TICKET_KEY) || ""; } catch (e) {}
    }
    // Drop the ticket from the address bar so it isn't shoulder-surfed or copied.
    if (m && window.history && window.history.replaceState) {
      try { window.history.replaceState(null, "", window.location.pathname); } catch (e) {}
    }
  } catch (e) {}

  // ---- elements ----
  var lobby = document.getElementById("lobby");
  var stage = document.getElementById("stage");
  var nameInput = document.getElementById("nameInput");
  var joinBtn = document.getElementById("joinBtn");
  var lobbyErr = document.getElementById("lobbyErr");
  var remoteVideo = document.getElementById("remoteVideo");
  var localVideo = document.getElementById("localVideo");
  var waiting = document.getElementById("waiting");
  var liveBadge = document.getElementById("liveBadge");
  var pipOff = document.getElementById("pipOff");
  var micBtn = document.getElementById("micBtn");
  var camBtn = document.getElementById("camBtn");
  var flipBtn = document.getElementById("flipBtn");
  var leaveBtn = document.getElementById("leaveBtn");
  var scriptBtn = document.getElementById("scriptBtn");
  var remoteWrap = document.getElementById("remoteWrap");
  var cowatch = document.getElementById("cowatch");
  var freezeScrim = document.getElementById("freezeScrim");
  var annoOverlay = document.getElementById("annoOverlay");
  var annoSvg = document.getElementById("annoSvg");
  var topPill = document.getElementById("topPill");
  var topPillText = document.getElementById("topPillText");
  var scriptPanel = document.getElementById("scriptPanel");
  var scriptList = document.getElementById("scriptList");
  var scriptProgress = document.getElementById("scriptProgress");
  var scriptCloseBtn = document.getElementById("scriptCloseBtn");
  var toastEl = document.getElementById("toast");
  var notesList = document.getElementById("notesList");
  var recPill = document.getElementById("recPill");
  var recPillText = document.getElementById("recPillText");

  // restore last name
  try {
    var savedName = localStorage.getItem("sideline_guest_name");
    if (savedName) nameInput.value = savedName;
  } catch (e) {}

  var ICONS = {
    mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>',
    micOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"/><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"/><line x1="12" y1="19" x2="12" y2="23"/></svg>',
    cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>',
    camOff: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 16v1a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2m5.66 0H14a2 2 0 0 1 2 2v3.34l1 1L23 7v10"/><line x1="1" y1="1" x2="23" y2="23"/></svg>',
    leave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"/><line x1="23" y1="1" x2="1" y2="23"/></svg>',
    flip: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>',
    clipboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6a1 1 0 0 1 1 1v1h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2V3a1 1 0 0 1 1-1z"/><path d="M9 4h6"/><path d="M8 11h8M8 15h5"/></svg>'
  };
  // small inline check used in script rows
  var CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  micBtn.innerHTML = ICONS.mic;
  camBtn.innerHTML = ICONS.cam;
  flipBtn.innerHTML = ICONS.flip;
  leaveBtn.innerHTML = ICONS.leave;
  scriptBtn.insertAdjacentHTML("afterbegin", ICONS.clipboard);

  function showLobbyErr(msg) {
    lobbyErr.textContent = msg;
    lobbyErr.style.display = "block";
  }

  var room = null;
  var micEnabled = true;
  var camEnabled = true;
  // "user" = front (selfie, mirrored), "environment" = back (e.g. filming a
  // thrower). Drives both the camera constraint and the local preview mirror.
  var facingMode = "user";

  function tokenServerOrigin() { return window.location.origin; }

  joinBtn.addEventListener("click", function () {
    var name = (nameInput.value || "").trim() || "Guest";
    try { localStorage.setItem("sideline_guest_name", name); } catch (e) {}
    join(name);
  });

  nameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") joinBtn.click();
  });

  async function join(name) {
    joinBtn.disabled = true;
    lobbyErr.style.display = "none";
    joinBtn.textContent = "Connecting…";

    try {
      // Send the room ticket (Phase 0). The server derives identity from it; we
      // never send our own identity (that was the impersonation hole).
      var resp = await fetch(tokenServerOrigin() + "/token", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ room: roomId, name: name, ticket: roomTicket })
      });
      if (!resp.ok) {
        var detail = "";
        try { detail = (await resp.json()).error || ""; } catch (e) {}
        // 401 here almost always means the link's ticket is missing or expired.
        if (resp.status === 401) {
          throw new Error("This session link has expired or is missing its pass. Ask your coach to send a fresh link.");
        }
        throw new Error(detail || ("Server returned " + resp.status));
      }
      var data = await resp.json();
      if (!data.token || !data.url) throw new Error("Bad token response from server.");

      room = new Room({ adaptiveStream: true, dynacast: true });
      wireRoomEvents(room);

      await room.connect(data.url, data.token);

      // Publish camera + mic (needs HTTPS + this user gesture; Render gives HTTPS).
      await room.localParticipant.enableCameraAndMicrophone();
      attachLocalVideo();

      // Switch to call stage.
      lobby.style.display = "none";
      stage.style.display = "block";

      // Reset any prior in-call UI state (rejoin safety).
      resetCallState();

      // If someone is already in the room, show them.
      room.remoteParticipants.forEach(function (p) { bindRemote(p); });
      refreshRemoteState();

      // Announce ourselves so the coach replays mode + script:sync + draw:sync.
      myName = name;
      sendHello(name);
    } catch (err) {
      console.error("[sideline] join failed:", err);
      var msg = err && err.message ? err.message : "Could not join the session.";
      if (/getUserMedia|Permission|NotAllowed|denied/i.test(msg)) {
        msg = "Camera/mic permission denied. Allow access and try again.";
      } else if (/NotFound|Requested device/i.test(msg)) {
        msg = "No camera or microphone found on this device.";
      }
      showLobbyErr(msg);
      joinBtn.disabled = false;
      joinBtn.textContent = "Join session";
      if (room) { try { await room.disconnect(); } catch (e) {} room = null; }
    }
  }

  // Hidden container that holds detached remote audio <audio> elements so they
  // keep playing and we can clean them up. Video always uses #remoteVideo.
  var audioSinks = []; // { sid, el }

  // Attach a single remote track. Idempotent: LiveKit's attach() reuses the
  // element if already attached, so calling this from both TrackSubscribed and
  // bindRemote is safe and order-independent.
  function attachRemoteTrack(track) {
    if (!track) return;
    if (track.kind === Track.Kind.Video) {
      track.attach(remoteVideo);
      remoteVideo.playsInline = true;
      remoteVideo.style.display = "block";
    } else if (track.kind === Track.Kind.Audio) {
      // Don't double-add the same audio sid.
      var sid = track.sid || "";
      for (var i = 0; i < audioSinks.length; i++) {
        if (audioSinks[i].sid === sid && audioSinks[i].el && audioSinks[i].el.isConnected) return;
      }
      var el = track.attach(); // creates an <audio>, auto-plays
      try { el.autoplay = true; el.setAttribute("playsinline", ""); } catch (e) {}
      // Keep it in the DOM so iOS Safari doesn't pause/GC it.
      el.style.display = "none";
      document.body.appendChild(el);
      audioSinks.push({ sid: sid, el: el });
      // iOS sometimes needs a nudged play() after a user gesture (join click counts).
      if (el.play) { var pr = el.play(); if (pr && pr.catch) pr.catch(function () {}); }
    }
  }

  function detachRemoteTrack(track) {
    if (!track) return;
    if (track.kind === Track.Kind.Video) {
      track.detach(remoteVideo);
      remoteVideo.style.display = "none";
    } else if (track.kind === Track.Kind.Audio) {
      track.detach();
      var sid = track.sid || "";
      audioSinks = audioSinks.filter(function (s) {
        if (s.sid === sid) { try { if (s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el); } catch (e) {} return false; }
        return true;
      });
    }
  }

  function wireRoomEvents(r) {
    r.on(RoomEvent.TrackSubscribed, function (track, pub, participant) {
      attachRemoteTrack(track);
      refreshRemoteState();
    });

    r.on(RoomEvent.TrackUnsubscribed, function (track) {
      detachRemoteTrack(track);
      refreshRemoteState();
    });

    // Late joiners: when a participant connects after us, bind whatever they've
    // already published and stay subscribed for anything that publishes later.
    r.on(RoomEvent.ParticipantConnected, function (p) { bindRemote(p); refreshRemoteState(); });
    r.on(RoomEvent.ParticipantDisconnected, function () {
      remoteVideo.style.display = "none";
      refreshRemoteState();
    });

    // Data channel: CoachTime protocol (topic "ct.v1", reliable).
    r.on(RoomEvent.DataReceived, function (payload, participant, kind, topic) {
      if (topic !== CALL_TOPIC) return;
      var msg = decodeMessage(payload);
      if (msg) handleCallMessage(msg);
    });

    r.on(RoomEvent.Disconnected, function () {
      // Server-side or network disconnect — return to lobby.
      teardownToLobby("You left the session.");
    });
  }

  function bindRemote(participant) {
    if (!participant) return;
    // Attach any already-subscribed tracks (covers late local join + late
    // remote publish where the track may already be live).
    participant.trackPublications.forEach(function (pub) {
      if (pub.track) attachRemoteTrack(pub.track);
      // Make sure we're subscribed so tracks published later still fire
      // TrackSubscribed. autoSubscribe is on by default, but be explicit.
      try { if (pub.setSubscribed) pub.setSubscribed(true); } catch (e) {}
    });
  }

  // ======================================================================
  //  CoachTime in-call data protocol (topic "ct.v1"). Mirrors the locked
  //  wire contract in coach-room-app/lib/call/protocol.ts. JSON over the
  //  LiveKit data channel, reliable delivery. Player side is read-only.
  // ======================================================================
  var CALL_TOPIC = "ct.v1";
  var encoder = new TextEncoder();
  var decoder = new TextDecoder();
  var myName = "Guest";

  function decodeMessage(payload) {
    try {
      var parsed = JSON.parse(decoder.decode(payload));
      if (parsed && (parsed.v === 1 || parsed.v === 2) && typeof parsed.t === "string") return parsed;
      return null;
    } catch (e) { return null; }
  }

  function sendData(obj) {
    if (!room || !room.localParticipant) return;
    try {
      var bytes = encoder.encode(JSON.stringify(obj));
      room.localParticipant.publishData(bytes, { reliable: true, topic: CALL_TOPIC });
    } catch (e) { /* non-fatal: data channel best-effort */ }
  }

  function sendHello(name) {
    sendData({ v: 2, t: "hello", role: "player", name: String(name || "Guest").slice(0, 80) });
  }

  // ---- in-call protocol state ----
  var callMode = "face";          // face | cowatch | freeze | share
  var shapes = [];                // validated ShapeWire objects (v2)
  var scriptItems = null;         // null = never received; [] = empty list
  var liveNotes = [];             // NoteWire objects from the coach
  var cowatchActive = false;

  function resetCallState() {
    callMode = "face";
    shapes = [];
    scriptItems = null;
    liveNotes = [];
    cowatchActive = false;
    stopClipRecording("reset");
    renderShapes();
    renderScript();
    endCowatch();
    applyMode("face");
    setUnread(false);
  }

  // ---- input validation: everything below is PEER input, treat as hostile ----
  function isNum(n) { return typeof n === "number" && isFinite(n); }
  function clampStr(v, max) { return typeof v === "string" ? v.slice(0, max || 200) : ""; }

  // Accept only a safe SVG path "d": digits, dot, minus, space, and the path
  // commands we expect from the coach (M/L plus their relative forms). Anything
  // else (letters that could smuggle script, etc.) is rejected outright. The
  // value is only ever set via setAttribute on an <svg:path>, never innerHTML.
  var SAFE_PATH_RE = /^[MLmlHhVvZzCcSsQqTtAa0-9eE.,\-+\s]+$/;
  function safePath(d) {
    if (typeof d !== "string") return null;
    var s = d.trim();
    if (!s || s.length > 8000) return null;
    if (!SAFE_PATH_RE.test(s)) return null;
    return s;
  }

  // v2 shape validation — every field of peer input checked before render.
  var SHAPE_TOOLS = { pen: 1, line: 1, arrow: 1, circle: 1, angle: 1 };
  var COLOR_RE = /^#[0-9A-Fa-f]{6}$/;
  function clamp01(n) { return isNum(n) ? Math.max(-0.5, Math.min(1.5, n)) : null; }
  function safePt(p) {
    if (!p || typeof p !== "object") return null;
    var x = clamp01(p.x), y = clamp01(p.y);
    return x === null || y === null ? null : { x: x, y: y };
  }
  function safeShape(sh) {
    if (!sh || typeof sh !== "object") return null;
    if (!SHAPE_TOOLS[sh.tool]) return null;
    var out = {
      id: clampStr(sh.id, 64),
      tool: sh.tool,
      color: COLOR_RE.test(sh.color) ? sh.color : "#D4C36A",
      width: isNum(sh.width) ? Math.max(1, Math.min(12, sh.width)) : 4
    };
    if (sh.tool === "pen") {
      var d = safePath(sh.d);
      if (!d) return null;
      out.d = d;
    } else if (sh.tool === "line" || sh.tool === "arrow") {
      out.from = safePt(sh.from); out.to = safePt(sh.to);
      if (!out.from || !out.to) return null;
    } else if (sh.tool === "circle") {
      out.center = safePt(sh.center);
      out.r = isNum(sh.r) ? Math.max(0, Math.min(2, sh.r)) : null;
      if (!out.center || out.r === null) return null;
    } else if (sh.tool === "angle") {
      out.p1 = safePt(sh.p1); out.p2 = safePt(sh.p2); out.p3 = safePt(sh.p3);
      if (!out.p1 || !out.p2 || !out.p3) return null;
    }
    return out;
  }

  function handleCallMessage(msg) {
    switch (msg.t) {
      case "mode":
        applyMode(typeof msg.mode === "string" ? msg.mode : "face");
        break;
      case "script:sync":
        applyScriptSync(Array.isArray(msg.items) ? msg.items : []);
        break;
      case "draw:shape":
        var sh = safeShape(msg.shape);
        if (sh) { shapes.push(sh); renderShapes(); }
        break;
      case "draw:undo":
        shapes.pop(); renderShapes();
        break;
      case "draw:clear":
        shapes = []; renderShapes(); clearFreeze();
        break;
      case "draw:sync":
        shapes = [];
        if (Array.isArray(msg.shapes)) {
          msg.shapes.forEach(function (raw) {
            var ok = safeShape(raw);
            if (ok) shapes.push(ok);
          });
        }
        renderShapes();
        break;
      case "notes:sync":
        applyNotesSync(Array.isArray(msg.items) ? msg.items : []);
        break;
      case "cowatch:rate":
        if (cowatchVideoEl && isNum(msg.rate) && msg.rate >= 0.1 && msg.rate <= 2) {
          try { cowatchVideoEl.playbackRate = msg.rate; } catch (e) {}
        }
        break;
      case "clip:request":
        startClipRecording(msg);
        break;
      case "clip:stop":
        finishClipRecording();
        break;
      case "cowatch:load":
        loadCowatch(msg);
        break;
      case "cowatch:play":
        cowatchSync("play", msg.pos);
        break;
      case "cowatch:pause":
        cowatchSync("pause", msg.pos);
        break;
      case "cowatch:seek":
        cowatchSync("seek", msg.pos);
        break;
      case "cowatch:end":
        endCowatch();
        applyMode("face");
        break;
      case "moment":
        showMoment(msg.kind, msg.label);
        break;
      // "hello" from another peer is ignored on the player side.
      default: break;
    }
  }

  // ---------------- Mode awareness ----------------
  function applyMode(mode) {
    callMode = mode;
    var frozen = (mode === "freeze");
    // Freeze: dim the live frame + show the drawing pill, KEEP strokes.
    if (frozen) {
      freezeScrim.style.display = "block";
      showTopPill("Coach froze the frame · drawing");
      return;
    }
    // Any non-freeze mode: the overlay stays — v2 draws over LIVE video too.
    // Only the freeze scrim drops.
    freezeScrim.style.display = "none";
    if (!cowatchActive) hideTopPill();
  }

  // Clear the telestration overlay + freeze visuals (not co-watch).
  function clearFreeze() {
    shapes = [];
    renderShapes();
    freezeScrim.style.display = "none";
    if (!cowatchActive) hideTopPill();
  }

  // ---------------- Annotations (v2 shapes) ----------------
  // Coords arrive normalized 0..1; we render in PIXEL space (viewBox matches
  // the overlay's size) so circles stay circles and angle labels read true.
  // Re-render on resize keeps everything proportional.
  var SVG_NS = "http://www.w3.org/2000/svg";
  function el(tag, attrs) {
    var n = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  }
  function angleDegrees(p1, p2, p3) {
    var v1x = p1.x - p2.x, v1y = p1.y - p2.y;
    var v2x = p3.x - p2.x, v2y = p3.y - p2.y;
    var m1 = Math.hypot(v1x, v1y), m2 = Math.hypot(v2x, v2y);
    if (!m1 || !m2) return 0;
    var cos = Math.max(-1, Math.min(1, (v1x * v2x + v1y * v2y) / (m1 * m2)));
    return Math.round(Math.acos(cos) * 180 / Math.PI);
  }
  // Denormalize a pen path "M x y L x y" from 0..1 to pixels.
  function denormPath(d, w, h) {
    var parts = d.split(/\s+/), axis = 0, out = [];
    for (var i = 0; i < parts.length; i++) {
      var tok = parts[i];
      if (tok === "M" || tok === "L") { axis = 0; out.push(tok); continue; }
      var n = Number(tok);
      if (isNaN(n)) { out.push(tok); continue; }
      out.push((n * (axis === 0 ? w : h)).toFixed(1));
      axis = axis === 0 ? 1 : 0;
    }
    return out.join(" ");
  }
  function renderShapes() {
    while (annoSvg.firstChild) annoSvg.removeChild(annoSvg.firstChild);
    var show = shapes.length > 0;
    annoOverlay.style.display = show ? "block" : "none";
    if (!show) return;
    var w = annoOverlay.clientWidth || 1, h = annoOverlay.clientHeight || 1;
    annoSvg.setAttribute("viewBox", "0 0 " + w + " " + h);
    var X = function (p) { return p.x * w; }, Y = function (p) { return p.y * h; };
    for (var i = 0; i < shapes.length; i++) {
      var sh = shapes[i];
      var stroke = { stroke: sh.color, "stroke-width": sh.width, fill: "none",
                     "stroke-linecap": "round", "stroke-linejoin": "round" };
      if (sh.tool === "pen") {
        annoSvg.appendChild(el("path", Object.assign({ d: denormPath(sh.d, w, h) }, stroke)));
      } else if (sh.tool === "line") {
        annoSvg.appendChild(el("line", Object.assign({ x1: X(sh.from), y1: Y(sh.from), x2: X(sh.to), y2: Y(sh.to) }, stroke)));
      } else if (sh.tool === "arrow") {
        var x1 = X(sh.from), y1 = Y(sh.from), x2 = X(sh.to), y2 = Y(sh.to);
        var ang = Math.atan2(y2 - y1, x2 - x1), head = 14 + sh.width * 1.5;
        annoSvg.appendChild(el("line", Object.assign({ x1: x1, y1: y1, x2: x2, y2: y2 }, stroke)));
        annoSvg.appendChild(el("line", Object.assign({ x1: x2, y1: y2, x2: x2 + head * Math.cos(ang + Math.PI - 0.45), y2: y2 + head * Math.sin(ang + Math.PI - 0.45) }, stroke)));
        annoSvg.appendChild(el("line", Object.assign({ x1: x2, y1: y2, x2: x2 + head * Math.cos(ang + Math.PI + 0.45), y2: y2 + head * Math.sin(ang + Math.PI + 0.45) }, stroke)));
      } else if (sh.tool === "circle") {
        annoSvg.appendChild(el("circle", Object.assign({ cx: X(sh.center), cy: Y(sh.center), r: sh.r * w }, stroke)));
      } else if (sh.tool === "angle") {
        annoSvg.appendChild(el("line", Object.assign({ x1: X(sh.p2), y1: Y(sh.p2), x2: X(sh.p1), y2: Y(sh.p1) }, stroke)));
        annoSvg.appendChild(el("line", Object.assign({ x1: X(sh.p2), y1: Y(sh.p2), x2: X(sh.p3), y2: Y(sh.p3) }, stroke)));
        annoSvg.appendChild(el("circle", { cx: X(sh.p2), cy: Y(sh.p2), r: 3.5, fill: sh.color }));
        var t = el("text", { x: X(sh.p2) + 12, y: Y(sh.p2) - 12, fill: sh.color,
                             "font-size": 16, "font-weight": 700, stroke: "none" });
        t.textContent = angleDegrees(sh.p1, sh.p2, sh.p3) + "°";
        annoSvg.appendChild(t);
      }
    }
  }
  window.addEventListener("resize", function () { if (shapes.length) renderShapes(); });

  // ---------------- Practice script (read-only) ----------------
  function applyScriptSync(items) {
    var clean = [];
    for (var i = 0; i < items.length && i < 200; i++) {
      var it = items[i];
      if (it && typeof it === "object") {
        clean.push({
          id: clampStr(it.id, 64),
          text: clampStr(it.text, 300),
          done: it.done === true
        });
      }
    }
    scriptItems = clean;
    renderScript();
    // If the panel is closed, flag unread so the player notices the change.
    if (!scriptPanel.classList.contains("open")) setUnread(true);
  }

  function renderScript() {
    while (scriptList.firstChild) scriptList.removeChild(scriptList.firstChild);
    if (scriptItems === null) {
      var none = document.createElement("li");
      none.className = "empty";
      none.textContent = "Coach hasn't shared a script yet.";
      scriptList.appendChild(none);
      scriptProgress.textContent = "";
      return;
    }
    if (scriptItems.length === 0) {
      var emptyLi = document.createElement("li");
      emptyLi.className = "empty";
      emptyLi.textContent = "The script is empty.";
      scriptList.appendChild(emptyLi);
      scriptProgress.textContent = "";
      return;
    }
    var done = 0;
    for (var i = 0; i < scriptItems.length; i++) {
      var item = scriptItems[i];
      if (item.done) done++;
      var li = document.createElement("li");
      if (item.done) li.className = "done";
      var box = document.createElement("span");
      box.className = "box";
      if (item.done) box.innerHTML = CHECK_SVG; // static, trusted constant only
      var txt = document.createElement("span");
      txt.className = "txt";
      txt.textContent = item.text; // peer text -> textContent, never HTML
      li.appendChild(box);
      li.appendChild(txt);
      scriptList.appendChild(li);
    }
    scriptProgress.textContent = done + " of " + scriptItems.length;
  }

  function setUnread(on) { scriptBtn.classList.toggle("has-unread", !!on); }

  function toggleScript() {
    var open = scriptPanel.classList.toggle("open");
    if (open) {
      setUnread(false);
      if (scriptItems === null) renderScript(); // show empty state
      renderNotes();
    }
  }
  scriptBtn.addEventListener("click", toggleScript);
  scriptCloseBtn.addEventListener("click", function () { scriptPanel.classList.remove("open"); });

  // ---------------- Co-watch ----------------
  var cowatchVideoEl = null; // direct <video> for provider "other"

  function youtubeId(url) {
    // Extract an 11-char video id from common YouTube URL forms.
    var m = String(url).match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }
  function driveFileId(url) {
    var m = String(url).match(/\/file\/d\/([A-Za-z0-9_-]+)/) || String(url).match(/[?&]id=([A-Za-z0-9_-]+)/);
    return m ? m[1] : null;
  }

  function clearCowatchStage() {
    while (cowatch.firstChild) cowatch.removeChild(cowatch.firstChild);
    cowatchVideoEl = null;
  }

  function loadCowatch(msg) {
    var url = clampStr(msg.url, 2000);
    var provider = msg.provider;
    var title = clampStr(msg.title, 200);
    clearCowatchStage();

    if (provider === "other") {
      // Direct film URL: must be https (CSP media-src https:). Reject otherwise.
      if (!/^https:\/\//i.test(url)) { endCowatch(); return; }
      var v = document.createElement("video");
      v.src = url; // src attribute, not innerHTML
      v.setAttribute("playsinline", "");
      v.playsInline = true;
      v.controls = false;
      v.id = "cowatchVideo";
      cowatch.appendChild(v);
      cowatchVideoEl = v;
    } else if (provider === "youtube") {
      var yid = youtubeId(url);
      if (!yid) { endCowatch(); return; }
      var f = document.createElement("iframe");
      f.id = "cowatchFrame";
      // Only the id is interpolated, and it's been regex-validated to [A-Za-z0-9_-]{11}.
      f.src = "https://www.youtube.com/embed/" + yid + "?playsinline=1&rel=0";
      f.setAttribute("allow", "autoplay; encrypted-media; picture-in-picture");
      f.setAttribute("allowfullscreen", "");
      cowatch.appendChild(f);
    } else if (provider === "drive") {
      var did = driveFileId(url);
      if (!did) { endCowatch(); return; }
      var df = document.createElement("iframe");
      df.id = "cowatchFrame";
      df.src = "https://drive.google.com/file/d/" + did + "/preview";
      df.setAttribute("allow", "autoplay");
      df.setAttribute("allowfullscreen", "");
      cowatch.appendChild(df);
    } else {
      endCowatch();
      return;
    }

    cowatchActive = true;
    cowatch.style.display = "flex";
    remoteWrap.classList.add("cowatch"); // shrinks coach camera to PiP
    // Drop the freeze scrim; shapes persist (draw-over-film is allowed in v2).
    freezeScrim.style.display = "none";
    showTopPill("Watching with coach" + (title ? " · " + title : ""));
  }

  function cowatchSync(action, pos) {
    // Only provider "other" (direct <video>) supports playhead sync in v1.
    if (!cowatchVideoEl) return;
    var p = isNum(pos) ? pos : null;
    try {
      if (action === "seek") {
        if (p !== null) cowatchVideoEl.currentTime = p;
      } else if (action === "play") {
        if (p !== null && Math.abs(cowatchVideoEl.currentTime - p) > 0.5) cowatchVideoEl.currentTime = p;
        var pr = cowatchVideoEl.play(); if (pr && pr.catch) pr.catch(function () {});
      } else if (action === "pause") {
        if (p !== null && Math.abs(cowatchVideoEl.currentTime - p) > 0.5) cowatchVideoEl.currentTime = p;
        cowatchVideoEl.pause();
      }
    } catch (e) { /* tolerate media errors */ }
  }

  function endCowatch() {
    if (cowatchVideoEl) { try { cowatchVideoEl.pause(); } catch (e) {} }
    clearCowatchStage();
    cowatch.style.display = "none";
    cowatchActive = false;
    remoteWrap.classList.remove("cowatch"); // restore full camera stage
    if (callMode !== "freeze") hideTopPill();
  }

  // ---------------- Shared live notes (read-only) ----------------
  function fmtT(t) {
    if (!isNum(t)) return "";
    var sec = Math.max(0, Math.floor(t));
    return Math.floor(sec / 60) + ":" + ("0" + (sec % 60)).slice(-2);
  }
  function applyNotesSync(items) {
    var clean = [];
    for (var i = 0; i < items.length && i < 200; i++) {
      var it = items[i];
      if (it && typeof it === "object") {
        clean.push({ id: clampStr(it.id, 64), t: isNum(it.t) ? it.t : null, body: clampStr(it.body, 500) });
      }
    }
    liveNotes = clean;
    renderNotes();
    if (!scriptPanel.classList.contains("open")) setUnread(true);
  }
  function renderNotes() {
    while (notesList.firstChild) notesList.removeChild(notesList.firstChild);
    if (!liveNotes.length) {
      var none = document.createElement("li");
      none.className = "empty";
      none.textContent = "No notes yet this session.";
      notesList.appendChild(none);
      return;
    }
    for (var i = liveNotes.length - 1; i >= 0; i--) {
      var n = liveNotes[i];
      var li = document.createElement("li");
      if (n.t !== null) {
        var ts = document.createElement("span");
        ts.className = "nt";
        ts.textContent = fmtT(n.t);
        li.appendChild(ts);
      }
      var body = document.createElement("span");
      body.textContent = n.body; // peer text -> textContent only
      li.appendChild(body);
      notesList.appendChild(li);
    }
  }

  // ---------------- Live clip capture (the rep-review loop) ----------------
  // The coach taps Clip; we record OUR OWN camera at source quality with
  // MediaRecorder (not the compressed call video), upload to /clips/<room>,
  // and answer clip:ready with the playable URL. clip:stop ends a take early;
  // maxSeconds is the cap.
  var recorder = null;
  var recChunks = [];
  var recClipId = null;
  var recTimer = null;
  var recStartedAt = 0;

  function pickMime() {
    if (!window.MediaRecorder) return null;
    var prefs = ["video/mp4", "video/webm;codecs=vp9", "video/webm"];
    for (var i = 0; i < prefs.length; i++) {
      try { if (MediaRecorder.isTypeSupported(prefs[i])) return prefs[i]; } catch (e) {}
    }
    return "";
  }

  function startClipRecording(msg) {
    var clipId = clampStr(msg.id, 64);
    var maxS = isNum(msg.maxSeconds) ? Math.max(2, Math.min(30, msg.maxSeconds)) : 15;
    if (recorder) { sendData({ v: 2, t: "clip:error", id: clipId, reason: "already recording" }); return; }
    var mime = pickMime();
    if (mime === null) {
      sendData({ v: 2, t: "clip:error", id: clipId, reason: "this browser can't record video" });
      return;
    }
    var pub = room && room.localParticipant ? room.localParticipant.getTrackPublication(Track.Source.Camera) : null;
    var msTrack = pub && pub.track ? pub.track.mediaStreamTrack : null;
    if (!msTrack) {
      sendData({ v: 2, t: "clip:error", id: clipId, reason: "camera not available" });
      return;
    }
    try {
      var stream = new MediaStream([msTrack]);
      recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    } catch (e) {
      recorder = null;
      sendData({ v: 2, t: "clip:error", id: clipId, reason: "recorder failed to start" });
      return;
    }
    recChunks = [];
    recClipId = clipId;
    recStartedAt = Date.now();
    recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) recChunks.push(ev.data); };
    recorder.onstop = function () { uploadClip(); };
    recorder.onerror = function () {
      sendData({ v: 2, t: "clip:error", id: recClipId || clipId, reason: "recording error" });
      cleanupRecorder();
    };
    try { recorder.start(1000); } catch (e) {
      sendData({ v: 2, t: "clip:error", id: clipId, reason: "recording error" });
      cleanupRecorder();
      return;
    }
    recPillText.textContent = "Recording your rep\u2026";
    recPill.style.display = "flex";
    recTimer = setTimeout(function () { finishClipRecording(); }, maxS * 1000);
  }

  function finishClipRecording() {
    if (!recorder) return;
    if (recTimer) { clearTimeout(recTimer); recTimer = null; }
    recPillText.textContent = "Sending the clip\u2026";
    try { recorder.stop(); } catch (e) {
      sendData({ v: 2, t: "clip:error", id: recClipId, reason: "recording error" });
      cleanupRecorder();
    }
  }

  function stopClipRecording(_why) {
    if (recTimer) { clearTimeout(recTimer); recTimer = null; }
    if (recorder) { try { recorder.ondataavailable = null; recorder.onstop = null; recorder.stop(); } catch (e) {} }
    cleanupRecorder();
  }

  function cleanupRecorder() {
    recorder = null;
    recChunks = [];
    recClipId = null;
    if (recTimer) { clearTimeout(recTimer); recTimer = null; }
    recPill.style.display = "none";
  }

  async function uploadClip() {
    var clipId = recClipId;
    var durationS = Math.round((Date.now() - recStartedAt) / 1000);
    var blob = new Blob(recChunks, { type: recChunks.length && recChunks[0].type ? recChunks[0].type : "video/webm" });
    if (!blob.size) {
      sendData({ v: 2, t: "clip:error", id: clipId, reason: "empty recording" });
      cleanupRecorder();
      return;
    }
    try {
      // Phase 0 security: clips upload is now authenticated. A no-signup browser
      // athlete proves room membership with the same room ticket it used to
      // reach /token (sent as X-Room-Ticket; the raw body is the clip bytes, so
      // the ticket can't ride in the JSON body). Without it the server 401s.
      var clipHeaders = { "Content-Type": blob.type || "video/webm" };
      if (roomTicket) clipHeaders["X-Room-Ticket"] = roomTicket;
      var resp = await fetch(tokenServerOrigin() + "/clips/" + roomId, {
        method: "POST",
        headers: clipHeaders,
        body: blob
      });
      if (!resp.ok) {
        var reason = "upload failed";
        try { reason = (await resp.json()).error || reason; } catch (e) {}
        sendData({ v: 2, t: "clip:error", id: clipId, reason: reason });
      } else {
        var data = await resp.json();
        if (data && data.url) {
          sendData({ v: 2, t: "clip:ready", id: clipId, url: data.url, durationS: durationS });
        } else {
          sendData({ v: 2, t: "clip:error", id: clipId, reason: "bad upload response" });
        }
      }
    } catch (e) {
      sendData({ v: 2, t: "clip:error", id: clipId, reason: "network error during upload" });
    }
    cleanupRecorder();
  }

  // ---------------- Top pill ----------------
  function showTopPill(text) {
    topPillText.textContent = clampStr(text, 200);
    topPill.style.display = "flex";
  }
  function hideTopPill() { topPill.style.display = "none"; }

  // ---------------- Moment toast ----------------
  var DEFAULT_MOMENT = {
    mark: "Coach marked the moment",
    note: "Coach saved a note",
    drill: "Coach added a drill"
  };
  var toastTimer = null;
  function showMoment(kind, label) {
    // Kind-based copy is the spec default. Only fall back to the coach's label
    // when the kind is unrecognized (forward-compat with new moment types).
    var text = DEFAULT_MOMENT[kind];
    if (!text) {
      text = (typeof label === "string" && label.trim()) ? clampStr(label.trim(), 120) : "Coach marked the moment";
    }
    toastEl.textContent = text;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2000);
  }

  function refreshRemoteState() {
    var hasRemote = room && room.remoteParticipants && room.remoteParticipants.size > 0;
    if (hasRemote) {
      waiting.style.display = "none";
      liveBadge.style.display = "flex";
    } else {
      waiting.style.display = "block";
      liveBadge.style.display = "none";
      remoteVideo.style.display = "none";
    }
  }

  function attachLocalVideo() {
    var pub = room.localParticipant.getTrackPublication(Track.Source.Camera);
    if (pub && pub.track) {
      pub.track.attach(localVideo);
      pipOff.style.display = "none";
      localVideo.style.display = "block";
      // Mirror only the front camera (selfie). The back camera must NOT mirror,
      // or text/handedness reads backwards when filming.
      localVideo.style.transform = facingMode === "user" ? "scaleX(-1)" : "none";
    }
  }

  // ---- controls ----
  micBtn.addEventListener("click", async function () {
    if (!room) return;
    micEnabled = !micEnabled;
    await room.localParticipant.setMicrophoneEnabled(micEnabled);
    micBtn.classList.toggle("off", !micEnabled);
    micBtn.innerHTML = micEnabled ? ICONS.mic : ICONS.micOff;
    micBtn.title = micEnabled ? "Mute" : "Unmute";
  });

  camBtn.addEventListener("click", async function () {
    if (!room) return;
    camEnabled = !camEnabled;
    await room.localParticipant.setCameraEnabled(camEnabled);
    camBtn.classList.toggle("off", !camEnabled);
    camBtn.innerHTML = camEnabled ? ICONS.cam : ICONS.camOff;
    camBtn.title = camEnabled ? "Camera off" : "Camera on";
    if (camEnabled) {
      attachLocalVideo();
    } else {
      localVideo.style.display = "none";
      pipOff.style.display = "flex";
    }
  });

  // Flip between front (selfie) and back camera. Restarts the SAME published
  // track in place (no republish, the coach's subscription stays intact) with
  // the new facingMode, then re-attaches the preview with the right mirror.
  flipBtn.addEventListener("click", async function () {
    if (!room || !camEnabled) return;
    var pub = room.localParticipant.getTrackPublication(Track.Source.Camera);
    var track = pub && (pub.videoTrack || pub.track);
    if (!track || typeof track.restartTrack !== "function") return;
    var next = facingMode === "user" ? "environment" : "user";
    flipBtn.disabled = true;
    try {
      await track.restartTrack({ facingMode: next });
      facingMode = next;
      attachLocalVideo();
    } catch (e) {
      // Some devices reject "environment" (no back cam / busy). Stay put.
      try {
        toastEl.textContent = "Couldn't switch camera";
        toastEl.classList.add("show");
        setTimeout(function () { toastEl.classList.remove("show"); }, 2000);
      } catch (e2) {}
    } finally {
      flipBtn.disabled = false;
    }
  });

  leaveBtn.addEventListener("click", async function () {
    if (room) { try { await room.disconnect(); } catch (e) {} }
    teardownToLobby();
  });

  function teardownToLobby(msg) {
    room = null;
    // Drop any remote audio sinks we parked on <body>.
    audioSinks.forEach(function (s) { try { if (s.el && s.el.parentNode) s.el.parentNode.removeChild(s.el); } catch (e) {} });
    audioSinks = [];
    remoteVideo.style.display = "none";
    localVideo.style.display = "none";
    // Tear down in-call protocol UI so a rejoin starts clean.
    endCowatch();
    shapes = []; renderShapes();
    stopClipRecording("left");
    freezeScrim.style.display = "none";
    hideTopPill();
    scriptPanel.classList.remove("open");
    setUnread(false);
    remoteWrap.classList.remove("cowatch");
    stage.style.display = "none";
    lobby.style.display = "flex";
    joinBtn.disabled = false;
    joinBtn.textContent = "Join session";
    if (msg) { /* silent return is fine; lobby is clean */ }
  }

  // Clean up if the tab closes.
  window.addEventListener("pagehide", function () {
    if (room) { try { room.disconnect(); } catch (e) {} }
  });
})();
</script>
</body>
</html>
